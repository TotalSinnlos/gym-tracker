<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>History, correcting a set</title>

</head>
<body>


<style>@font-face{font-family:"Roboto Flex";src:url("../fonts/RobotoFlex-wght-latin.woff2") format("woff2");font-weight:100 1000;font-display:block}</style>
<style>
body{margin:0}
a{color:#6E4700}a:hover{color:#151412}
.scr{position:relative;overflow:hidden;width:390px;background:#FBFAF7;color:#151412;font-family:'Roboto Flex',Roboto,system-ui,sans-serif;box-sizing:border-box}
.scr *{box-sizing:border-box}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.i.s{width:14px;height:14px;stroke-width:3}
.ib{width:48px;height:48px;border-radius:24px;border:none;background:#F1EEE7;color:#151412;display:inline-flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.ex{background:#FFFFFF;border:1px solid #E4E0D7;border-radius:24px;padding:12px 8px 8px}
.exh{display:flex;align-items:center;gap:10px;padding:0 8px 6px}
.exh b{flex:1;font-size:16px;font-weight:650}
.tag{font-size:12px;font-weight:700;border-radius:10px;padding:3px 8px;display:inline-flex;align-items:center;gap:4px;background:#151412;color:#FFFFFF}
.set{display:flex;align-items:center;gap:12px;height:48px;padding:0 8px;border:none;border-radius:14px;width:100%;background:transparent;font-family:inherit;color:#151412;text-align:left}
.set.on{background:#FFF4D6;box-shadow:inset 0 0 0 2px #FFB300}
.set .k{font-size:14px;color:#5F5B53;width:48px}
.set .v{flex:1;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#FFFFFF;border-radius:32px 32px 0 0;box-shadow:0 -8px 28px rgba(21,20,18,0.12);padding:20px 20px 24px;display:flex;flex-direction:column;gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#5F5B53;min-width:0}
.in{height:60px;width:100%;border-radius:18px;border:1px solid #D6D1C6;padding:0 16px;font-family:inherit;font-size:28px;font-weight:700;color:#151412;background:#FFFFFF}
.in.foc{border:2px solid #151412}
.btn{height:64px;border-radius:32px;font-size:19px;font-weight:700;border:none;font-family:inherit;color:#151412;width:100%}
.note{display:flex;gap:10px;align-items:flex-start;background:#F1EEE7;border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.4}
</style>

<div class="scr" style="height: 844px">
  <div style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; height: 56px"><button class="ib" aria-label="Back to history"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button></div>
    <div><h1 style="margin: 0; font-size: 30px; font-weight: 720; letter-spacing: -0.6px">Sat 24 Oct 2026</h1><div style="font-size: 15px; color: #5F5B53; margin-top: 4px">Full body · 7 of 8 done</div></div>
    <div class="ex"><div class="exh"><b>Leg press</b><span class="tag"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Done</span></div>
      <button class="set"><span class="k">Set 1</span><span class="v">13 × 62.5 kg</span></button>
      <button class="set on"><span class="k">Set 2</span><span class="v">13 × 62.5 kg</span><span style="font-size: 13px; font-weight: 700; color: #6E4700">Editing</span></button></div>
  </div>
  <div class="sheet">
    <div style="font-size: 18px; font-weight: 700">Correct Leg press, set 2</div>
    <div class="g2">
      <label class="fld">Reps<input class="in foc" inputmode="numeric" value="11"></label>
      <label class="fld">Weight (kg)<input class="in" inputmode="decimal" value="62,5"></label>
    </div>
    <div class="note">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px; color: #6E4700"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 7.5h.01"></path></svg>
      <span>This is Leg press's latest result, so saving works out its current weight (now 65 kg) again.</span>
    </div>
    <div class="g2">
      <button class="btn" style="background: transparent; border: 1px solid #D6D1C6">Cancel</button>
      <button class="btn" style="background: #FFB300">Save</button>
    </div>
  </div>
</div>


</body>
</html>
