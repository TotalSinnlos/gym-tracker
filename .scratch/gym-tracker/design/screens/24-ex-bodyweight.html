<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Exercise, Pull-ups</title>

</head>
<body>


<style>@font-face{font-family:"Roboto Flex";src:url("../fonts/RobotoFlex-wght-latin.woff2") format("woff2");font-weight:100 1000;font-display:block}</style>
<style>
body{margin:0}
a{color:#6E4700}a:hover{color:#151412}
.scr{position:relative;overflow:hidden;width:390px;background:#FBFAF7;color:#151412;font-family:'Roboto Flex',Roboto,system-ui,sans-serif;box-sizing:border-box}
.scr *{box-sizing:border-box}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ib{width:48px;height:48px;border-radius:24px;border:none;background:#F1EEE7;color:#151412;display:inline-flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.card{background:#FFFFFF;border:1px solid #E4E0D7;border-radius:28px;padding:16px}
.ct{font-size:16px;font-weight:650}
.cs{font-size:13px;color:#5F5B53;margin-top:2px}
.ax{font-size:10px;fill:#5F5B53;font-family:'Roboto Flex',Roboto,sans-serif}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#5F5B53;margin-top:8px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.list{background:#FFFFFF;border:1px solid #E4E0D7;border-radius:24px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 12px 8px 16px;border:none;border-top:1px solid #EEEBE4;width:100%;background:transparent;text-align:left;font-family:inherit;color:#151412;font-size:16px;font-weight:600}
.li:first-child{border-top:none}
.note{font-size:13px;color:#5F5B53;line-height:1.45;padding:0 4px}
</style>

<div class="scr" style="height: 1160px; padding: 16px 20px 32px; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; height: 56px"><button class="ib" aria-label="Back to progress"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button></div>
  <div>
    <h1 style="margin: 0; font-size: 34px; font-weight: 720; letter-spacing: -0.8px">Pull-ups</h1>
    <div style="font-size: 14px; color: #5F5B53; margin-top: 4px">Bodyweight · 2 × 9–12</div>
  </div>
  <div style="background: #F1EEE7; border-radius: 24px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center">
    <div><div style="font-size: 13px; color: #5F5B53">Best session</div><div style="font-size: 26px; font-weight: 720; font-variant-numeric: tabular-nums">10 + 9 reps</div></div>
    <div style="background: #151412; color: #FFB300; border-radius: 14px; padding: 6px 10px; font-size: 13px; font-weight: 700">★ Range beaten</div>
  </div>
  <div class="card">
    <div class="ct">Reps per set</div>
    <div class="cs">Shaded band is the target, 9–12 reps</div>
    <svg role="img" aria-label="Reps per set across 12 sessions; set 1 rose from 5 to 10, set 2 from 4 to 9" width="100%" viewBox="0 0 334 170" fill="none" style="margin-top: 8px; display: block">
      <rect x="24" y="50" width="306" height="30" fill="#FFF4D6"></rect>
      <line x1="24" y1="50" x2="330" y2="50" stroke="#FFD66B" stroke-dasharray="3 3"></line><line x1="24" y1="80" x2="330" y2="80" stroke="#FFD66B" stroke-dasharray="3 3"></line>
      <text class="ax" x="6" y="53">12</text><text class="ax" x="10" y="83">9</text><text class="ax" x="10" y="133">4</text>
      <line x1="24" y1="150" x2="330" y2="150" stroke="#EEEBE4"></line>
      <text class="ax" x="24" y="164">Aug</text><text class="ax" x="300" y="164">Oct</text>
      <polyline points="24,130 50,120 76,120 102,110 128,110 154,110 180,100 206,100 232,100 258,90 284,90 310,80" stroke="#B07600" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 3"></polyline>
      <polyline points="24,120 50,110 76,110 102,100 128,100 154,90 180,90 206,90 232,80 258,80 284,70 310,70" stroke="#151412" stroke-width="2.2" stroke-linejoin="round"></polyline>
      <circle cx="310" cy="70" r="5" fill="#FFB300" stroke="#151412" stroke-width="2"></circle>
    </svg>
    <div class="leg"><span><svg width="22" height="6" aria-hidden="true"><line x1="0" y1="3" x2="22" y2="3" stroke="#151412" stroke-width="2.4"></line></svg>Set 1</span><span><svg width="22" height="6" aria-hidden="true"><line x1="0" y1="3" x2="22" y2="3" stroke="#B07600" stroke-width="2.2" stroke-dasharray="5 3"></line></svg>Set 2</span><span><svg width="16" height="10" aria-hidden="true"><rect width="16" height="10" rx="2" fill="#FFF4D6" stroke="#FFD66B"></rect></svg>Target range</span></div>
  </div>
  <div style="font-size: 13px; font-weight: 600; color: #5F5B53; margin: 8px 4px -8px">Settings</div>
  <div class="list">
    <button class="li"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg><span style="flex: 1">Edit Pull-ups</span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: #5F5B53"><path d="M9 5l7 7-7 7"></path></svg></button>
    <button class="li"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1.5"></rect><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"></path></svg><span style="flex: 1">Archive</span></button>
  </div>
  <div class="note">This exercise has history, so it can be archived but not deleted.</div>
</div>


</body>
</html>
