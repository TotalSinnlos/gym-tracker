<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>History, locked</title>

</head>
<body>


<style>@font-face{font-family:"Roboto Flex";src:url("../fonts/RobotoFlex-wght-latin.woff2") format("woff2");font-weight:100 1000;font-display:block}</style>
<style>
body{margin:0}
a{color:#6E4700}a:hover{color:#151412}
.scr{position:relative;overflow:hidden;width:390px;background:#FBFAF7;color:#151412;font-family:'Roboto Flex',Roboto,system-ui,sans-serif;box-sizing:border-box}
.scr *{box-sizing:border-box}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.i.s{width:14px;height:14px;stroke-width:3}
.ib{width:48px;height:48px;border-radius:24px;border:none;background:#F1EEE7;color:#151412;display:inline-flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.ex{background:#FFFFFF;border:1px solid #E4E0D7;border-radius:24px;padding:12px 8px 8px}
.exh{display:flex;align-items:center;gap:10px;padding:0 8px 6px}
.exh b{flex:1;font-size:16px;font-weight:650}
.tag{font-size:12px;font-weight:700;border-radius:10px;padding:3px 8px;display:inline-flex;align-items:center;gap:4px;background:#151412;color:#FFFFFF}
.set{display:flex;align-items:center;gap:12px;height:44px;padding:0 8px}
.set .k{font-size:14px;color:#5F5B53;width:48px}
.set .v{flex:1;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;color:#5F5B53}
.banner{display:flex;gap:12px;align-items:flex-start;background:#FFE4A0;border-radius:20px;padding:14px 16px;font-size:14px;line-height:1.45;color:#4A3300;font-weight:500}
</style>

<div class="scr" style="height: 1040px; padding: 16px 20px 32px; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: center; height: 56px"><button class="ib" aria-label="Back to history"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button></div>
  <div><h1 style="margin: 0; font-size: 30px; font-weight: 720; letter-spacing: -0.6px">Tue 20 Oct 2026</h1><div style="font-size: 15px; color: #5F5B53; margin-top: 4px">Quick day · 3 of 3 done</div></div>
  <div class="banner" role="status">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><rect x="5" y="11" width="14" height="10" rx="3"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
    <span>A session is running. You can correct or delete past sessions once it has ended.</span>
  </div>
  <div class="ex"><div class="exh"><b>Leg press</b><span class="tag"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Done</span></div>
    <div class="set"><span class="k">Set 1</span><span class="v">12 × 62.5 kg</span></div>
    <div class="set"><span class="k">Set 2</span><span class="v">11 × 62.5 kg</span></div></div>
  <div class="ex"><div class="exh"><b>Chest press</b><span class="tag"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Done</span></div>
    <div class="set"><span class="k">Set 1</span><span class="v">11 × 40 kg</span></div>
    <div class="set"><span class="k">Set 2</span><span class="v">11 × 40 kg</span></div></div>
  <div class="ex"><div class="exh"><b>Pull-ups</b><span class="tag"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Done</span></div>
    <div class="set"><span class="k">Set 1</span><span class="v">11 reps</span></div>
    <div class="set"><span class="k">Set 2</span><span class="v">10 reps</span></div></div>
</div>


</body>
</html>
