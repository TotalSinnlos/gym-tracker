<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Exercise, new</title>

</head>
<body>


<style>@font-face{font-family:"Roboto Flex";src:url("../fonts/RobotoFlex-wght-latin.woff2") format("woff2");font-weight:100 1000;font-display:block}</style>
<style>
body{margin:0}
a{color:#6E4700}a:hover{color:#151412}
.scr{position:relative;overflow:hidden;width:390px;background:#FBFAF7;color:#151412;font-family:'Roboto Flex',Roboto,system-ui,sans-serif;box-sizing:border-box}
.scr *{box-sizing:border-box}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ib{width:48px;height:48px;border-radius:24px;border:none;background:#F1EEE7;color:#151412;display:inline-flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.list{background:#FFFFFF;border:1px solid #E4E0D7;border-radius:24px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 12px 8px 16px;border:none;border-top:1px solid #EEEBE4;width:100%;background:transparent;text-align:left;font-family:inherit;color:#151412;font-size:16px;font-weight:600}
.li:first-child{border-top:none}
.li.dng{color:#B3261E}
</style>

<div class="scr" style="height: 1040px; padding: 16px 20px 32px; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; height: 56px"><button class="ib" aria-label="Back to progress"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button></div>
  <div>
    <h1 style="margin: 0; font-size: 34px; font-weight: 720; letter-spacing: -0.8px">Calf raise</h1>
    <div style="font-size: 14px; color: #5F5B53; margin-top: 4px">Machine · 30 kg (+5) · 2 × 9–12</div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <div style="background: #F1EEE7; border-radius: 24px; padding: 14px 16px"><div style="font-size: 13px; color: #5F5B53">Current weight</div><div style="font-size: 34px; font-weight: 720; letter-spacing: -1px">30<span style="font-size: 16px; font-weight: 600; color: #5F5B53"> kg</span></div></div>
    <div style="background: #F1EEE7; border-radius: 24px; padding: 14px 16px"><div style="font-size: 13px; color: #5F5B53">Last increase</div><div style="font-size: 18px; font-weight: 650; margin-top: 8px">No increase yet</div></div>
  </div>
  <div style="background: #FFFFFF; border: 1px solid #E4E0D7; border-radius: 28px; padding: 16px">
    <div style="font-size: 16px; font-weight: 650">Weight over time</div>
    <div style="height: 150px; margin-top: 10px; border-radius: 18px; background: #F7F5F0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px; text-align: center">
      <svg aria-hidden="true" width="72" height="28" viewBox="0 0 72 28" fill="none"><line x1="4" y1="24" x2="68" y2="24" stroke="#D6D1C6" stroke-width="2" stroke-dasharray="4 4"></line><circle cx="10" cy="14" r="5" fill="#151412"></circle></svg>
      <div style="font-size: 15px; font-weight: 600">1 session so far</div>
      <div style="font-size: 13px; color: #5F5B53">Charts appear after your second session.</div>
    </div>
  </div>
  <div style="font-size: 13px; font-weight: 600; color: #5F5B53; margin: 8px 4px -8px">Settings</div>
  <div class="list">
    <button class="li"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg><span style="flex: 1">Edit Calf raise</span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: #5F5B53"><path d="M9 5l7 7-7 7"></path></svg></button>
    <button class="li"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1.5"></rect><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"></path></svg><span style="flex: 1">Archive</span></button>
  </div>
  <div style="font-size: 13px; color: #5F5B53; line-height: 1.45; padding: 0 4px">With 0 sessions this would also show <b style="font-weight: 650; color: #B3261E">Delete</b> as a third row; with one session it can only be archived.</div>
  <div class="list">
    <button class="li dng"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"></path></svg><span style="flex: 1">Delete (never used)</span></button>
  </div>
</div>


</body>
</html>
