<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Home, several routines</title>

</head>
<body>


<style>@font-face{font-family:"Roboto Flex";src:url("../fonts/RobotoFlex-wght-latin.woff2") format("woff2");font-weight:100 1000;font-display:block}</style>
<style>
body{margin:0}
a{color:#6E4700}a:hover{color:#151412}
:root{--ink:#151412;--ink2:#5F5B53;--paper:#FBFAF7;--surf:#F1EEE7;--surf2:#F7F5F0;--card:#FFFFFF;--line:#E4E0D7;--line2:#D6D1C6;--amber:#FFB300;--amberC:#FFE4A0;--amberS:#FFF4D6;--amberInk:#6E4700;--err:#B3261E;--errC:#FCE8E6;--errInk:#8C1D18}
.scr{position:relative;overflow:hidden;width:390px;background:var(--paper);color:var(--ink);font-family:'Roboto Flex',Roboto,system-ui,sans-serif;box-sizing:border-box}
.scr *{box-sizing:border-box}
.pad{padding:0 20px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.i.fill{fill:currentColor;stroke:none}
.h1{margin:0;font-size:34px;font-weight:720;letter-spacing:-0.8px;line-height:1.1}
.mut{color:var(--ink2)}
.brand{display:flex;align-items:center;gap:12px;padding:24px 20px 0}
.brand-t{font-size:18px;font-weight:650}
.rc{width:100%;text-align:left;border:none;border-radius:32px;padding:20px;font-family:inherit;display:flex;flex-direction:column;gap:10px}
.rc-top{display:flex;align-items:center;justify-content:space-between;width:100%}
.rc-n{font-size:26px;font-weight:700}
.rc-c{font-size:14px;font-weight:600}
.rc-x{font-size:15px;line-height:1.45}
.play{width:56px;height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--surf);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:10px 8px 14px}
.nav button{border:none;background:transparent;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink2);font-size:12px;font-weight:500}
.nav .pill{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.nav .on{color:var(--ink);font-weight:700}
.nav .on .pill{background:var(--amberC)}
</style>

<div class="scr" style="height: 844px; display: flex; flex-direction: column">
  <div class="brand">
    <svg role="img" aria-label="CDT Gym Tracker logo" width="44" height="44" viewBox="18 18 72 72"><circle cx="54" cy="54" r="36" fill="#FFB300"></circle><g transform="translate(54 54) scale(0.64) translate(-50 -50)"><path d="M28 66 C28 54 36 50 50 50 C64 50 72 54 72 66 Z" fill="#151412"></path><path d="M37 40 L35 19 L46 32 Z M63 40 L65 19 L54 32 Z" fill="#151412" stroke="#151412" stroke-width="2" stroke-linejoin="round"></path><path d="M33 45 C33 36 40 30 50 30 C60 30 67 36 67 45 C67 53 60 60 50 62 C40 60 33 53 33 45 Z" fill="#151412"></path><rect x="14" y="62" width="72" height="8" rx="4" fill="#FFFFFF"></rect><rect x="12" y="50" width="12" height="32" rx="5" fill="#FFFFFF"></rect><rect x="76" y="50" width="12" height="32" rx="5" fill="#FFFFFF"></rect><rect x="36" y="58" width="11" height="17" rx="5.5" fill="#151412"></rect><rect x="53" y="58" width="11" height="17" rx="5.5" fill="#151412"></rect></g></svg>
    <div class="brand-t">CDT Gym Tracker</div>
  </div>
  <div style="flex: 1"></div>
  <div class="pad" style="padding-bottom: 104px; display: flex; flex-direction: column; gap: 12px">
    <div style="margin-bottom: 6px">
      <h1 class="h1" style="font-size: 40px; letter-spacing: -1px">Start a session</h1>
      <div class="mut" style="margin-top: 6px; font-size: 17px">Pick a routine</div>
    </div>
    <button class="rc" style="background: #151412; color: #FFFFFF">
      <span class="rc-top">
        <span style="display: flex; flex-direction: column; gap: 2px"><span class="rc-n">Full body</span><span class="rc-c" style="color: #FFB300">8 exercises</span></span>
        <span class="play" style="background: #FFB300; color: #151412"><svg class="i fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></span>
      </span>
      <span class="rc-x" style="color: #CFCAC0">Leg press · Chest press · Lat pulldown · Seated row · Leg curl · Shoulder press · Bicep curl · Pull-ups</span>
    </button>
    <button class="rc" style="background: #F1EEE7; color: #151412; border-radius: 32px 32px 32px 12px">
      <span class="rc-top">
        <span style="display: flex; flex-direction: column; gap: 2px"><span class="rc-n">Quick day</span><span class="rc-c" style="color: #6E4700">3 exercises</span></span>
        <span class="play" style="background: #151412; color: #FFB300"><svg class="i fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></span>
      </span>
      <span class="rc-x" style="color: #5F5B53">Leg press · Chest press · Pull-ups</span>
    </button>
  </div>
  <nav class="nav">
    <button class="on"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"></path></svg></span>Home</button>
    <button><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"></path></svg></span>Progress</button>
    <button><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2"></path></svg></span>History</button>
    <button><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></span>Settings</button>
  </nav>
</div>


</body>
</html>
