<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Summary, nothing special</title>

</head>
<body>


<style>@font-face{font-family:"Roboto Flex";src:url("../fonts/RobotoFlex-wght-latin.woff2") format("woff2");font-weight:100 1000;font-display:block}</style>
<style>
body{margin:0}
a{color:#6E4700}a:hover{color:#151412}
.scr{position:relative;overflow:hidden;width:390px;background:#FBFAF7;color:#151412;font-family:'Roboto Flex',Roboto,system-ui,sans-serif;box-sizing:border-box}
.scr *{box-sizing:border-box}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.btn{height:48px;padding:0 20px;border-radius:24px;border:1px solid #D6D1C6;background:transparent;font-family:inherit;font-size:15px;font-weight:650;color:#151412}
.btn.lg{height:64px;border-radius:32px;font-size:19px;font-weight:700;width:100%;border:none;background:#FFB300}
.list{background:#FFFFFF;border:1px solid #E4E0D7;border-radius:24px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid #EEEBE4}
.li:first-child{border-top:none}
.li-t{font-size:16px;font-weight:600}
.li-s{font-size:13px;color:#5F5B53}
.st{width:28px;height:28px;border-radius:14px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:#151412;color:#FFFFFF}
</style>

<div class="scr" style="height: 844px; padding: 28px 20px 24px; display: flex; flex-direction: column; gap: 16px">
  <div>
    <h1 style="margin: 0; font-size: 34px; font-weight: 720; letter-spacing: -0.8px">Session saved</h1>
    <div style="margin-top: 4px; font-size: 15px; color: #5F5B53">Tue 20 Oct · Quick day · 3 of 3 done</div>
  </div>
  <div style="background: #F1EEE7; border-radius: 24px; padding: 16px 18px; font-size: 15px; line-height: 1.45">
    <b style="font-weight: 650">Steady session.</b> <span style="color: #5F5B53">Same weights next time. Beat every set by a rep and they go up.</span>
  </div>
  <div class="list">
    <div class="li"><span class="st"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><div><div class="li-t">Leg press</div><div class="li-s">Done · 62.5 kg · 12 / 11 reps</div></div></div>
    <div class="li"><span class="st"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><div><div class="li-t">Chest press</div><div class="li-s">Done · 40 kg · 11 / 11 reps</div></div></div>
    <div class="li"><span class="st"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><div><div class="li-t">Pull-ups</div><div class="li-s">Done · 11 / 10 reps</div></div></div>
  </div>
  <div style="border: 1px solid #E4E0D7; border-radius: 24px; padding: 14px 14px 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <div><div style="font-size: 13px; color: #5F5B53">Last backup</div><div style="font-size: 16px; font-weight: 600">20 Oct 2026, 19:05</div></div>
    <button class="btn">Back up</button>
  </div>
  <div style="flex: 1"></div>
  <button class="btn lg">Done</button>
</div>


</body>
</html>
