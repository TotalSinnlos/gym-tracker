<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>History</title>

</head>
<body>


<style>@font-face{font-family:"Roboto Flex";src:url("../fonts/RobotoFlex-wght-latin.woff2") format("woff2");font-weight:100 1000;font-display:block}</style>
<style>
body{margin:0}
a{color:#6E4700}a:hover{color:#151412}
.scr{position:relative;overflow:hidden;width:390px;background:#FBFAF7;color:#151412;font-family:'Roboto Flex',Roboto,system-ui,sans-serif;box-sizing:border-box}
.scr *{box-sizing:border-box}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.mo{font-size:13px;font-weight:600;color:#5F5B53;margin:20px 4px 8px}
.list{background:#FFFFFF;border:1px solid #E4E0D7;border-radius:24px;overflow:hidden}
.li{display:flex;align-items:center;gap:14px;min-height:68px;padding:10px 12px 10px 12px;border:none;border-top:1px solid #EEEBE4;width:100%;background:transparent;text-align:left;font-family:inherit;color:#151412}
.li:first-child{border-top:none}
.d{width:48px;height:48px;border-radius:16px;background:#F1EEE7;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.d b{font-size:18px;font-weight:720}
.d span{font-size:10px;font-weight:700;color:#5F5B53;letter-spacing:0.4px;margin-top:2px}
.li-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li-t{font-size:16px;font-weight:600}
.li-s{font-size:13px;color:#5F5B53}
.dots{display:flex;gap:3px;margin-top:4px}
.dots i{width:8px;height:8px;border-radius:4px;background:#151412;display:block}
.dots i.h{background:transparent;box-shadow:inset 0 0 0 1.5px #151412}
.dots i.s{background:#E4E0D7}
.nav{position:absolute;left:0;right:0;bottom:0;height:84px;background:#F1EEE7;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:10px 8px 14px}
.nav button{border:none;background:transparent;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;color:#5F5B53;font-size:12px;font-weight:500}
.nav .pill{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.nav .on{color:#151412;font-weight:700}
.nav .on .pill{background:#FFE4A0}
</style>

<div class="scr" style="height: 1040px">
  <div style="padding: 28px 20px 0">
    <h1 style="margin: 0; font-size: 34px; font-weight: 720; letter-spacing: -0.8px">History</h1>
    <div style="margin-top: 4px; font-size: 15px; color: #5F5B53">25 sessions</div>
    <div class="mo">October</div>
    <div class="list">
      <button class="li"><span class="d"><b>24</b><span>SAT</span></span><span class="li-m"><span class="li-t">Sat 24 Oct 2026</span><span class="li-s">Full body · 7 of 8 done</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i class="s"></i><i></i><i></i><i></i></span></span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: #5F5B53"><path d="M9 5l7 7-7 7"></path></svg></button>
      <button class="li"><span class="d"><b>20</b><span>TUE</span></span><span class="li-m"><span class="li-t">Tue 20 Oct 2026</span><span class="li-s">Quick day · 3 of 3 done</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: #5F5B53"><path d="M9 5l7 7-7 7"></path></svg></button>
      <button class="li"><span class="d"><b>17</b><span>SAT</span></span><span class="li-m"><span class="li-t">Sat 17 Oct 2026</span><span class="li-s">Full body · 8 of 8 done</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: #5F5B53"><path d="M9 5l7 7-7 7"></path></svg></button>
      <button class="li"><span class="d"><b>13</b><span>TUE</span></span><span class="li-m"><span class="li-t">Tue 13 Oct 2026</span><span class="li-s">Full body · 6 of 8 done</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i class="h"></i><i></i><i class="s"></i><i></i></span></span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: #5F5B53"><path d="M9 5l7 7-7 7"></path></svg></button>
      <button class="li"><span class="d"><b>10</b><span>SAT</span></span><span class="li-m"><span class="li-t">Sat 10 Oct 2026</span><span class="li-s">Full body · 8 of 8 done</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: #5F5B53"><path d="M9 5l7 7-7 7"></path></svg></button>
    </div>
    <div class="mo">September</div>
    <div class="list">
      <button class="li"><span class="d"><b>30</b><span>WED</span></span><span class="li-m"><span class="li-t">Wed 30 Sep 2026</span><span class="li-s">Full body · 8 of 8 done</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: #5F5B53"><path d="M9 5l7 7-7 7"></path></svg></button>
      <button class="li"><span class="d"><b>26</b><span>SAT</span></span><span class="li-m"><span class="li-t">Sat 26 Sep 2026</span><span class="li-s">Full body · 8 of 8 done</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: #5F5B53"><path d="M9 5l7 7-7 7"></path></svg></button>
    </div>
  </div>
  <nav class="nav">
    <button><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"></path></svg></span>Home</button>
    <button><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"></path></svg></span>Progress</button>
    <button class="on"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2"></path></svg></span>History</button>
    <button><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></span>Settings</button>
  </nav>
</div>


</body>
</html>
