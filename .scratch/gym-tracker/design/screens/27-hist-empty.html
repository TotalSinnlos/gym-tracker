<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>History, empty</title>

</head>
<body>


<style>@font-face{font-family:"Roboto Flex";src:url("../fonts/RobotoFlex-wght-latin.woff2") format("woff2");font-weight:100 1000;font-display:block}</style>
<style>
body{margin:0}
a{color:#6E4700}a:hover{color:#151412}
.scr{position:relative;overflow:hidden;width:390px;background:#FBFAF7;color:#151412;font-family:'Roboto Flex',Roboto,system-ui,sans-serif;box-sizing:border-box}
.scr *{box-sizing:border-box}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nav{position:absolute;left:0;right:0;bottom:0;height:84px;background:#F1EEE7;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:10px 8px 14px}
.nav button{border:none;background:transparent;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;color:#5F5B53;font-size:12px;font-weight:500}
.nav .pill{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.nav .on{color:#151412;font-weight:700}
.nav .on .pill{background:#FFE4A0}
</style>

<div class="scr" style="height: 844px">
  <div style="padding: 28px 20px 0">
    <h1 style="margin: 0; font-size: 34px; font-weight: 720; letter-spacing: -0.8px">History</h1>
  </div>
  <div style="margin: 24px 20px 0; border: 1.5px dashed #D6D1C6; border-radius: 32px; padding: 32px 24px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start">
    <div aria-hidden="true" style="display: flex; gap: 6px"><span style="width: 40px; height: 40px; border-radius: 14px; border: 1.5px dashed #D6D1C6"></span><span style="width: 40px; height: 40px; border-radius: 14px; border: 1.5px dashed #D6D1C6"></span><span style="width: 40px; height: 40px; border-radius: 14px; border: 1.5px dashed #D6D1C6"></span></div>
    <div style="font-size: 22px; font-weight: 700">No sessions yet.</div>
    <div style="font-size: 15px; line-height: 1.45; color: #5F5B53">They'll appear here once you end one.</div>
  </div>
  <nav class="nav">
    <button><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"></path></svg></span>Home</button>
    <button><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"></path></svg></span>Progress</button>
    <button class="on"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2"></path></svg></span>History</button>
    <button><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></span>Settings</button>
  </nav>
</div>


</body>
</html>
