<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>History, session detail</title>

</head>
<body>


<style>@font-face{font-family:"Roboto Flex";src:url("../fonts/RobotoFlex-wght-latin.woff2") format("woff2");font-weight:100 1000;font-display:block}</style>
<style>
body{margin:0}
a{color:#6E4700}a:hover{color:#151412}
.scr{position:relative;overflow:hidden;width:390px;background:#FBFAF7;color:#151412;font-family:'Roboto Flex',Roboto,system-ui,sans-serif;box-sizing:border-box}
.scr *{box-sizing:border-box}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.i.s{width:14px;height:14px;stroke-width:3}
.ib{width:48px;height:48px;border-radius:24px;border:none;background:#F1EEE7;color:#151412;display:inline-flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.ex{background:#FFFFFF;border:1px solid #E4E0D7;border-radius:24px;padding:12px 8px 8px}
.exh{display:flex;align-items:center;gap:10px;padding:0 8px 6px}
.exh b{flex:1;font-size:16px;font-weight:650}
.tag{font-size:12px;font-weight:700;border-radius:10px;padding:3px 8px;display:inline-flex;align-items:center;gap:4px}
.tag.done{background:#151412;color:#FFFFFF}
.tag.inc{background:#F1EEE7;color:#151412}
.tag.skip{background:transparent;color:#5F5B53;box-shadow:inset 0 0 0 1.5px #D6D1C6}
.set{display:flex;align-items:center;gap:12px;height:48px;padding:0 8px;border:none;border-radius:14px;width:100%;background:transparent;font-family:inherit;color:#151412;text-align:left}
.set .k{font-size:14px;color:#5F5B53;width:48px}
.set .v{flex:1;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.btn{height:56px;padding:0 22px;border-radius:28px;font-family:inherit;font-size:16px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;background:transparent;color:#B3261E;border:1px solid #E6B8B3}
</style>

<div class="scr" style="height: 1620px; padding: 16px 20px 32px; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: center; height: 56px"><button class="ib" aria-label="Back to history"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button></div>
  <div style="margin-bottom: 4px">
    <h1 style="margin: 0; font-size: 30px; font-weight: 720; letter-spacing: -0.6px">Sat 24 Oct 2026</h1>
    <div style="font-size: 15px; color: #5F5B53; margin-top: 4px">Full body · 7 of 8 done · tap a set to correct it</div>
  </div>
  <div class="ex"><div class="exh"><b>Leg press</b><span class="tag done"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Done</span></div>
    <button class="set"><span class="k">Set 1</span><span class="v">13 × 62.5 kg</span></button>
    <button class="set"><span class="k">Set 2</span><span class="v">13 × 62.5 kg</span></button></div>
  <div class="ex"><div class="exh"><b>Chest press</b><span class="tag done"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Done</span></div>
    <button class="set"><span class="k">Set 1</span><span class="v">13 × 40 kg</span></button>
    <button class="set"><span class="k">Set 2</span><span class="v">14 × 40 kg</span></button></div>
  <div class="ex"><div class="exh"><b>Lat pulldown</b><span class="tag done"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Done</span></div>
    <button class="set"><span class="k">Set 1</span><span class="v">11 × 45 kg</span></button>
    <button class="set"><span class="k">Set 2</span><span class="v">10 × 45 kg</span></button></div>
  <div class="ex"><div class="exh"><b>Seated row</b><span class="tag done"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Done</span></div>
    <button class="set"><span class="k">Set 1</span><span class="v">12 × 42.5 kg</span></button>
    <button class="set"><span class="k">Set 2</span><span class="v">11 × 42.5 kg</span></button></div>
  <div class="ex"><div class="exh"><b style="color: #5F5B53">Leg curl</b><span class="tag skip">– Skipped</span></div></div>
  <div class="ex"><div class="exh"><b>Shoulder press</b><span class="tag done"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Done</span></div>
    <button class="set"><span class="k">Set 1</span><span class="v">11 × 14 kg</span></button>
    <button class="set"><span class="k">Set 2</span><span class="v">10 × 14 kg</span></button></div>
  <div class="ex"><div class="exh"><b>Bicep curl</b><span class="tag done"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Done</span></div>
    <button class="set"><span class="k">Set 1</span><span class="v">10 × 12 kg</span></button>
    <button class="set"><span class="k">Set 2</span><span class="v">9 × 12 kg</span></button>
    <button class="set"><span class="k">Set 3</span><span class="v">9 × 12 kg</span></button></div>
  <div class="ex"><div class="exh"><b>Pull-ups</b><span class="tag done"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Done</span></div>
    <button class="set"><span class="k">Set 1</span><span class="v">13 reps</span></button>
    <button class="set"><span class="k">Set 2</span><span class="v">13 reps</span></button></div>
  <div style="flex: 1"></div>
  <button class="btn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"></path></svg>Delete session</button>
</div>


</body>
</html>
