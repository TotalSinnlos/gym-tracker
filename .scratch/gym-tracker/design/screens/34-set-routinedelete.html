<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Delete routine confirmation</title>

</head>
<body>


<style>@font-face{font-family:"Roboto Flex";src:url("../fonts/RobotoFlex-wght-latin.woff2") format("woff2");font-weight:100 1000;font-display:block}</style>
<style>
body{margin:0}
a{color:#6E4700}a:hover{color:#151412}
.scr{position:relative;overflow:hidden;width:390px;background:#FBFAF7;color:#151412;font-family:'Roboto Flex',Roboto,system-ui,sans-serif;box-sizing:border-box}
.scr *{box-sizing:border-box}
.ghost{background:#FFFFFF;border:1px solid #E4E0D7;border-radius:24px;height:180px}
.scrim{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(21,20,18,0.45)}
.dlg{position:absolute;left:12px;right:12px;bottom:16px;background:#FFFFFF;border-radius:32px;padding:24px 20px 20px;display:flex;flex-direction:column;gap:12px}
.btn{height:64px;border-radius:32px;font-size:19px;font-weight:700;font-family:inherit;width:100%}
</style>

<div class="scr" style="height: 844px">
  <div aria-hidden="true" style="padding: 88px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="font-size: 30px; font-weight: 720; letter-spacing: -0.6px">Edit routine</div>
    <div style="height: 56px; border: 1px solid #D6D1C6; border-radius: 18px; background: #FFFFFF; padding: 0 16px; display: flex; align-items: center; font-size: 18px; font-weight: 600">Quick day</div>
    <div class="ghost"></div>
  </div>
  <div class="scrim"></div>
  <div class="dlg" role="alertdialog" aria-labelledby="t">
    <div id="t" style="font-size: 24px; font-weight: 720; letter-spacing: -0.3px">Delete this routine?</div>
    <div style="font-size: 15px; line-height: 1.45; color: #5F5B53; margin-bottom: 8px">Your exercises and past sessions are kept.</div>
    <button class="btn" style="background: transparent; border: 1px solid #D6D1C6; color: #151412">Keep it</button>
    <button class="btn" style="background: #B3261E; border: none; color: #FFFFFF">Delete routine</button>
  </div>
</div>


</body>
</html>
